:root{
  --paper:#ffffff; --ink:#000000; --mute:rgba(0,0,0,.5); --line:rgba(0,0,0,.85);
  --size:160px; --track:0em; --lead:1.1;
  --ui:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic","Meiryo",system-ui,sans-serif;
}
:root[data-mode="ink"]{ --paper:#000000; --ink:#ffffff; --mute:rgba(255,255,255,.5); --line:rgba(255,255,255,.85); }
*{box-sizing:border-box;margin:0}
html{background:var(--paper);color:var(--ink);transition:background .5s,color .5s}
body{font-family:var(--ui);font-weight:300;min-height:100vh;display:flex;flex-direction:column;position:relative}
main,header,footer{position:relative;z-index:1}
header{display:flex;justify-content:space-between;align-items:baseline;padding:28px clamp(20px,5vw,72px) 0}
.mark{font-family:"Test01",serif;font-size:28px;letter-spacing:.06em}
.meta{font-size:12px;letter-spacing:.08em;color:var(--mute)}
.stroke{display:block;width:100%;height:14px;margin-top:18px}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.toolbar{display:flex;flex-wrap:wrap;gap:18px 36px;align-items:center;padding:20px clamp(20px,5vw,72px);font-size:12px;letter-spacing:.04em}
.toolbar label{display:flex;align-items:center;gap:10px;color:var(--mute)}
.toolbar output{min-width:3.2em;color:var(--ink);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:120px;height:1px;background:var(--line);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--ink);cursor:pointer}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border:0;border-radius:50%;background:var(--ink);cursor:pointer}
input[type=range]:focus-visible::-webkit-slider-thumb{outline:1px solid var(--ink);outline-offset:4px}
.tog{padding:4px 0;border-bottom:1px solid transparent;color:var(--mute)}
.tog:hover,.tog[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tog:focus-visible,.chip:focus-visible,.g:focus-visible{outline:1px solid var(--ink);outline-offset:4px}
.spacer{flex:1}
.stage{flex:1;padding:clamp(16px,4vw,48px) clamp(20px,5vw,72px);min-height:52vh;position:relative}
#t{
  display:block;width:100%;border:0;outline:0;resize:none;background:transparent;overflow:hidden;
  font-family:"Test01",serif;color:var(--ink);caret-color:var(--ink);
  font-size:min(var(--size),38vw);letter-spacing:var(--track);line-height:var(--lead);
  text-transform:uppercase;font-kerning:normal;
}
#t::placeholder{color:var(--mute)}
#t::selection{background:var(--ink);color:var(--paper)}
.vertical #t{writing-mode:vertical-rl;text-orientation:upright;height:62vh;overflow-x:auto;overflow-y:hidden}
.note{position:absolute;left:clamp(20px,5vw,72px);bottom:12px;font-size:12px;color:var(--mute);opacity:0;transition:opacity .4s}
.note.on{opacity:1}
section{padding:36px clamp(20px,5vw,72px)}
h2{font-weight:300;font-size:12px;letter-spacing:.14em;color:var(--mute);margin-bottom:22px}
.chips{display:flex;flex-wrap:wrap;gap:10px 26px}
.chip{font-size:13px;color:var(--mute);padding:4px 0;border-bottom:1px solid transparent}
.chip:hover{color:var(--ink);border-bottom-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.g{font-family:"Test01",serif;font-size:54px;aspect-ratio:1;display:grid;place-items:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);transition:background .25s,color .25s}
.g:hover{background:var(--ink);color:var(--paper)}
.ladder{display:grid;gap:14px;font-family:"Test01",serif;overflow-x:auto;white-space:nowrap}
.ladder div{display:flex;align-items:baseline;gap:20px}
.ladder small{font:300 11px var(--ui);color:var(--mute);min-width:36px}
footer{padding:40px clamp(20px,5vw,72px) 48px;font-size:12px;color:var(--mute);letter-spacing:.04em}
.lead-note{font-size:12px;line-height:1.9;letter-spacing:.04em;color:var(--mute);margin-top:-8px}
@media (max-width:640px){ input[type=range]{width:92px} .spacer{display:none} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="mark">TEST 01</div>
  <div class="meta">書体体験 · Type Tester</div>
</header>
<svg class="stroke" viewBox="0 0 1200 14" preserveAspectRatio="none" aria-hidden="true">
  <filter id="dry" x="-2%" y="-100%" width="104%" height="300%">
    <feTurbulence type="fractalNoise" baseFrequency=".012 .6" numOctaves="3" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <rect x="0" y="5" width="1200" height="3" fill="currentColor" filter="url(#dry)"/>
</svg>

<main>
  <section>
    <h2>グリフ · GLYPHS — タップで下の入力欄へ</h2>
    <div class="grid" id="grid"></div>
  </section>

  <section>
    <h2>サイズ比較 · SIZES</h2>
    <div class="ladder" id="ladder"></div>
  </section>

  <section id="input" style="padding-bottom:0"><h2>入力 · TRY IT</h2><p class="lead-note">This typeface supports uppercase letters only.<br>本書体は大文字の入力のみ対応しています。</p></section>
  <div class="toolbar" role="group" aria-label="文字設定">
    <label>サイズ <input id="size" type="range" min="24" max="360" value="160"><output id="sizeO">160</output></label>
    <label>字間 <input id="track" type="range" min="-10" max="60" value="0"><output id="trackO">0</output></label>
    <label>行間 <input id="lead" type="range" min="70" max="200" value="110"><output id="leadO">1.10</output></label>
    <span class="spacer"></span>
    <button class="tog" id="vert" aria-pressed="false">縦書き</button>
    <button class="tog" id="mode" aria-pressed="false">墨 / 紙</button>
  </div>

  <div class="stage" id="stage">
    <textarea id="t" rows="1" spellcheck="false" autocomplete="off" autocapitalize="characters" aria-label="書体を試すテキスト入力" placeholder="TYPE HERE"></textarea>
    <div class="note" id="note" role="status">A–Zの大文字とスペースのみ対応しています。</div>
  </div>

  <section>
    <h2>サンプル · SAMPLE</h2>
    <div class="chips">
      <button class="chip" data-s="ABCDEFGHIJKLMNOPQRSTUVWXYZ">アルファベット</button>
      <button class="chip" data-s="THE QUICK BROWN FOX JUMPS OVER THE LAZY DOG">PANGRAM</button>
      <button class="chip" data-s="SUMI TO YOHAKU">SUMI TO YOHAKU</button>
      <button class="chip" data-s="WABI SABI">WABI SABI</button>
      <button class="chip" data-s="KAZE NO OTO">KAZE NO OTO</button>
      <button class="chip" data-s="">クリア</button>
    </div>
  </section>
</main>

<footer>test — 01 Regular · A–Z</footer>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var t=$('t'), root=document.documentElement, stage=$('stage'), note=$('note'), noteTimer;
  var vertical=false;

  function fit(){
    if(vertical){t.style.height='';return}
    t.style.height='auto'; t.style.height=t.scrollHeight+'px';
  }
  function warn(){
    note.classList.add('on'); clearTimeout(noteTimer);
    noteTimer=setTimeout(function(){note.classList.remove('on')},2600);
  }
  function clean(){
    var v=t.value, c=v.toUpperCase().replace(/[^A-Z \n]/g,'');
    if(c!==v){
      var pos=t.selectionStart-(v.length-c.length);
      t.value=c; t.setSelectionRange(Math.max(0,pos),Math.max(0,pos));
      warn();
    }
    fit();
  }
  t.addEventListener('input',clean);
  t.addEventListener('paste',function(){setTimeout(clean,0)});

  function bind(id,out,fmt,apply){
    var el=$(id),o=$(out);
    function go(){o.textContent=fmt(+el.value);apply(+el.value);fit()}
    el.addEventListener('input',go); go();
  }
  bind('size','sizeO',function(v){return v},function(v){root.style.setProperty('--size',v+'px')});
  bind('track','trackO',function(v){return (v/100).toFixed(2)},function(v){root.style.setProperty('--track',(v/100)+'em')});
  bind('lead','leadO',function(v){return (v/100).toFixed(2)},function(v){root.style.setProperty('--lead',v/100)});

  $('vert').addEventListener('click',function(){
    vertical=!vertical; this.setAttribute('aria-pressed',vertical);
    stage.classList.toggle('vertical',vertical); document.body.classList.toggle('vertical',vertical);
    fit();
  });
  $('mode').addEventListener('click',function(){
    var ink=root.getAttribute('data-mode')!=='ink';
    if(ink) root.setAttribute('data-mode','ink'); else root.removeAttribute('data-mode');
    this.setAttribute('aria-pressed',ink);
  });

  function setText(s){t.value=s;clean();t.focus()}
  document.querySelectorAll('.chip').forEach(function(b){
    b.addEventListener('click',function(){setText(b.getAttribute('data-s'))});
  });

  var grid=$('grid');
  'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(function(ch){
    var b=document.createElement('button'); b.className='g'; b.textContent=ch; b.setAttribute('aria-label',ch+' を入力');
    b.addEventListener('click',function(){
      var s=t.selectionStart,e=t.selectionEnd;
      t.value=t.value.slice(0,s)+ch+t.value.slice(e);
      t.setSelectionRange(s+1,s+1); fit(); document.getElementById('input').scrollIntoView({behavior:'smooth',block:'start'}); t.focus({preventScroll:true});
    });
    grid.appendChild(b);
  });

  var lad=$('ladder');
  [14,20,32,48,72].forEach(function(px){
    var d=document.createElement('div'),s=document.createElement('small'),p=document.createElement('span');
    s.textContent=px+'px'; p.style.fontSize=px+'px'; p.textContent='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    d.appendChild(s);d.appendChild(p);lad.appendChild(d);
  });

  setText('SUMI TO YOHAKU'); t.blur();
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fit);
  window.addEventListener('resize',fit);
})();
</script>
</body>
</html>
